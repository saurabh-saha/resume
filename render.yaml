# Render blueprint. New > Blueprint, point it at this repo, then set the
# secrets below in the dashboard (they are deliberately not in git).
services:
  - type: web
    name: resume-editor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Render supplies $PORT. 0.0.0.0 so the container is reachable.
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Set these in the dashboard — sync:false keeps them out of the repo.
      - key: DATABASE_URL
        sync: false
      - key: RESUME_LOCATION
        sync: false
      - key: RESUME_PHONE
        sync: false
      - key: RESUME_EMAIL
        sync: false
      - key: RESUME_LINKEDIN
        sync: false
